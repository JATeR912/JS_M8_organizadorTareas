<!DOCTYPE html>
<html lang="es">
<head><title>Prueba de Subida</title></head>
<body>
  <h2>Probar Subida de Avatar</h2>
  <form action="http://localhost:3000/usuarios/4/perfil" method="POST" enctype="multipart/form-data">
    <input type="text" name="telefono" placeholder="Teléfono" value="+56912345678" /><br><br>
    <input type="text" name="sobre_mi" placeholder="Sobre mí" value="Soy desarrolladora web" /><br><br>
    <input type="file" name="avatar" accept="image/*" /><br><br>
    <button type="submit">Enviar al Backend</button>
  </form>
</body>
</html>
